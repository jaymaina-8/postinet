name: Scheduled Posts Cron Job

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-cron:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Cron Endpoint
        run: |
          echo "Triggering Postinet cron job at $(date -u)"
          
          # Make the request and capture response
          # Follow HTTP redirects (fixes 308 Permanent Redirect returned by target)
          response=$(curl -L -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}")
          
          # Extract HTTP status code
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          
          echo "HTTP Status: $http_status"
          echo "Response: $body"
          
          # Check if request was successful (2xx status code)
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "✅ Cron job completed successfully"
            exit 0
          else
            echo "❌ Cron job failed with HTTP status $http_status"
            exit 1
          fi



